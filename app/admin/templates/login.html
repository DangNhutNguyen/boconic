<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — Boconic Admin Console</title>
  <link rel="stylesheet" href="/admin/static/css/admin.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
    }
    .login-box {
      width: 100%;
      max-width: 400px;
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
    }
    .brand {
      text-align: center;
      margin-bottom: 30px;
    }
    .brand-logo {
      display: inline-block;
      width: 48px;
      height: 48px;
      line-height: 48px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      font-weight: 800;
      font-size: 1.5rem;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
    }
    .brand-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="brand">
      <div class="brand-logo">B</div>
      <h1 class="brand-title">Boconic</h1>
      <p class="brand-sub">Hệ thống Quản trị Cộng đồng & Thư viện</p>
    </div>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form action="/admin/login" method="POST">
      <div class="form-group">
        <label for="username">Tên đăng nhập quản trị</label>
        <input type="text" id="username" name="username" required autofocus placeholder="admin">
      </div>
      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px;">
        Đăng nhập vào hệ thống
      </button>
    </form>
  </div>
</body>
</html>
